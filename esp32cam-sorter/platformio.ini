[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DEI_MAX_OVERFLOW_BUFFER_COUNT=256
